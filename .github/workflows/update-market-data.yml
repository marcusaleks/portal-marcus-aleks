name: "update-market-data"

on:
  # Triggers agendados (horários em UTC, convertem para Brasília: -3h)
  schedule:
    # SELIC + PTAX + Curva DI — Seg-Sex 21h30 BRT (00h30 UTC dia seguinte)
    # ANBIMA publica ETTJ após fechamento do mercado (~20h BRT)
    - cron: "30 0 * * 2-6"
    # IPCA — Todos os dias 13h BRT (16h UTC)
    - cron: "0 16 * * *"

  # Permitir execução manual (workflow_dispatch)
  workflow_dispatch:
    inputs:
      series:
        description: "Qual série atualizar? (selic, ipca, ptax, all)"
        required: false
        default: "all"

env:
  NODE_VERSION: "20"
  DATA_BRANCH: "data/automated"
  TARGET_BRANCH: "main"

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout data/automated"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.DATA_BOT_TOKEN }}

      - name: "Sincronizar data/automated com main"
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          git config user.name "Marcus Aleks"
          git config user.email "178334383+marcusaleks@users.noreply.github.com"
          git fetch origin ${{ env.TARGET_BRANCH }}
          # Merge completo (não só public/data/) — evita que data/automated
          # fique com código desatualizado quando main recebe mudanças
          # estruturais (ex: incidente 2026-07-26, onde a migração do
          # fetcher isolado não chegou a esta branch e quebrou o workflow
          # por 4 dias). Sem -X theirs de propósito: se houver conflito
          # real, o step deve falhar visivelmente em vez de resolver
          # silenciosamente a favor de um lado.
          git merge origin/${{ env.TARGET_BRANCH }} --no-edit
          echo "✅ data/automated sincronizado com main (merge completo)"

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: scripts/data-fetcher/package-lock.json

      - name: "Install dependencies (fetcher isolado)"
        working-directory: scripts/data-fetcher
        run: npm ci --prefer-offline --no-audit

      - name: "Fetch market data (BCB)"
        working-directory: scripts/data-fetcher
        env:
          SERIES: ${{ github.event.inputs.series || 'all' }}
        run: |
          echo "🚀 Iniciando fetch de dados do Banco Central..."
          npx ts-node --project tsconfig.json fetch-market-data.ts
        continue-on-error: true

      - name: "Fetch Curva DI (ANBIMA)"
        working-directory: scripts/data-fetcher
        run: |
          echo "📈 Buscando Curva DI da ANBIMA..."
          npx ts-node --project tsconfig.json fetch-curva-di.ts
        continue-on-error: true

      - name: "Check if data changed"
        id: check_changes
        run: |
          if git diff --quiet public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Sem mudanças nos dados"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Alterações detectadas em public/data/"
            git diff --name-only public/data/
          fi

      - name: "Commit e push em data/automated"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "Marcus Aleks"
          git config user.email "178334383+marcusaleks@users.noreply.github.com"

          # Garantir que apenas public/data/*.json será commitado
          UNEXPECTED=$(git diff --name-only | grep -v '^public/data/' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "❌ ABORTADO: arquivos fora de public/data/ foram modificados:"
            echo "$UNEXPECTED"
            exit 1
          fi

          SERIES_UPDATED=""
          if ! git diff --quiet public/data/selic.json; then
            SERIES_UPDATED="${SERIES_UPDATED}SELIC "
          fi
          if ! git diff --quiet public/data/ipca.json; then
            SERIES_UPDATED="${SERIES_UPDATED}IPCA "
          fi
          if ! git diff --quiet public/data/ptax.json; then
            SERIES_UPDATED="${SERIES_UPDATED}PTAX "
          fi
          if ! git diff --quiet public/data/curva_di.json; then
            SERIES_UPDATED="${SERIES_UPDATED}CurvaDI "
          fi

          echo "series_updated=${SERIES_UPDATED}" >> $GITHUB_ENV
          git add public/data/*.json
          git commit -m "chore(data): atualiza séries do BCB — ${SERIES_UPDATED}[automated]"
          git push origin ${{ env.DATA_BRANCH }}
          echo "✅ Push em ${{ env.DATA_BRANCH }} concluído"

      - name: "Abrir PR data/automated → main"
        if: steps.check_changes.outputs.changed == 'true'
        id: open_pr
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          TODAY=$(date -u +"%Y-%m-%d")

          cat > /tmp/pr-body.md << EOF
          ## Atualização automática de dados — ${TODAY}

          **Séries atualizadas:** ${series_updated}

          | Série | Fonte |
          |---|---|
          | SELIC | BCB Série 11 |
          | IPCA | BCB Série 433 |
          | PTAX | BCB Série 10813 |
          | Curva DI | ANBIMA |

          > Gerado automaticamente pelo workflow \`update-market-data\`. Não requer revisão humana.
          EOF

          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "${{ env.TARGET_BRANCH }}" \
            --head "${{ env.DATA_BRANCH }}" \
            --title "chore(data): atualiza séries do BCB — ${series_updated}[${TODAY}]" \
            --body-file /tmp/pr-body.md 2>&1) || true

          if echo "$PR_URL" | grep -q "already exists"; then
            echo "ℹ️ PR já existe — atualizando com novo commit"
            PR_URL=$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "${{ env.DATA_BRANCH }}" \
              --base "${{ env.TARGET_BRANCH }}" \
              --json url --jq '.[0].url')
          fi

          echo "✅ PR: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: "Aprovar PR (conta secundária marcus-aleks)"
        if: steps.check_changes.outputs.changed == 'true' && steps.open_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_APPROVER_TOKEN }}
        run: |
          gh pr review "${{ steps.open_pr.outputs.pr_url }}" \
            --approve \
            --body "Aprovação automática — conteúdo restrito a public/data/*.json, CI verde, fonte BCB/ANBIMA verificada."
          echo "✅ PR aprovado pela conta marcus-aleks"

      - name: "Habilitar auto-merge (conta principal marcusaleks)"
        if: steps.check_changes.outputs.changed == 'true' && steps.open_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.DATA_BOT_TOKEN }}
        run: |
          gh pr merge "${{ steps.open_pr.outputs.pr_url }}" \
            --auto \
            --squash \
            --delete-branch=false
          echo "✅ Auto-merge habilitado — aguardando CI verde"

      - name: "Notify on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_title = `❌ Falha no fetch de dados do BCB — ${new Date().toISOString().split('T')[0]}`;
            const issue_body = `
            **Workflow:** update-market-data
            **Status:** ❌ FALHOU
            **Data/Hora:** ${new Date().toISOString()}
            **Branch:** ${process.env.GITHUB_REF}
            **Commit:** ${process.env.GITHUB_SHA}
            **Run:** [${process.env.GITHUB_RUN_ID}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ### Impacto
            - Dados de mercado (SELIC, IPCA, PTAX) **não foram atualizados**
            - Calculadora continuará com última snapshot conhecida
            - Sem impacto imediato em produção, mas dados ficam obsoletos após ~24h

            ### Ação Necessária
            1. Investigar logs do workflow
            2. Validar endpoints BCB manualmente:
               - SELIC: https://api.bcb.gov.br/dados/serie/bcdata.sgs.11/dados?format=json
               - IPCA: https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?format=json
               - PTAX: https://api.bcb.gov.br/dados/serie/bcdata.sgs.10813/dados?format=json
            3. Se BCB estiver down, fechar esta issue depois de restaurar
            4. Se erro persistir, escalacionar para @marcusaleks
            `;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["automation:market-data", "severity:high"],
              state: "open"
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ["automation:market-data", "severity:high", "needs-investigation"]
              });
            }


  # Job secundário: validar integridade dos dados
  validate-data:
    needs: update-market-data
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Validate JSON structure"
        run: |
          echo "🔍 Validando estrutura JSON..."

          if ! node -e "const data = require('./public/data/selic.json'); if (data.series !== '11' || !Array.isArray(data.data)) throw new Error('SELIC schema inválido')"; then
            echo "❌ selic.json estrutura inválida"
            exit 1
          fi
          echo "✅ selic.json validado"

          if ! node -e "const data = require('./public/data/ipca.json'); if (data.series !== '433' || !Array.isArray(data.data)) throw new Error('IPCA schema inválido')"; then
            echo "❌ ipca.json estrutura inválida"
            exit 1
          fi
          echo "✅ ipca.json validado"

          if ! node -e "const data = require('./public/data/ptax.json'); if (data.series !== '10813' || !Array.isArray(data.data)) throw new Error('PTAX schema inválido')"; then
            echo "❌ ptax.json estrutura inválida"
            exit 1
          fi
          echo "✅ ptax.json validado"

          if ! node -e "const data = require('./public/data/feriados_nacionais.json'); if (!Array.isArray(data.feriados)) throw new Error('feriados schema inválido')"; then
            echo "❌ feriados_nacionais.json estrutura inválida"
            exit 1
          fi
          echo "✅ feriados_nacionais.json validado"

          echo "✅ Todos os arquivos de dados validados com sucesso"

      - name: "Check data freshness"
        run: |
          echo "📅 Verificando atualização de dados..."

          SELIC_UPDATE=$(node -e "const data = require('./public/data/selic.json'); console.log(data.last_updated)")
          IPCA_UPDATE=$(node -e "const data = require('./public/data/ipca.json'); console.log(data.last_updated)")
          PTAX_UPDATE=$(node -e "const data = require('./public/data/ptax.json'); console.log(data.last_updated)")

          echo "📊 Última atualização:"
          echo "  SELIC: $SELIC_UPDATE"
          echo "  IPCA: $IPCA_UPDATE"
          echo "  PTAX: $PTAX_UPDATE"
