name: "update-market-data"

on:
  # Triggers agendados (horários em UTC, convertem para Brasília: -3h)
  schedule:
    # SELIC + PTAX — Seg-Sex 18h30 BRT (21h30 UTC)
    - cron: "30 21 * * 1-5"
    # IPCA — Todos os dias 13h BRT (16h UTC)
    - cron: "0 16 * * *"

  # Permitir execução manual (workflow_dispatch)
  workflow_dispatch:
    inputs:
      series:
        description: "Qual série atualizar? (selic, ipca, ptax, all)"
        required: false
        default: "all"

env:
  NODE_VERSION: "20"

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci --prefer-offline --no-audit

      - name: "Fetch market data"
        env:
          SERIES: ${{ github.event.inputs.series || 'all' }}
        run: |
          echo "🚀 Iniciando fetch de dados do Banco Central..."
          npx ts-node scripts/fetch-market-data.ts
        continue-on-error: true

      - name: "Check if data changed"
        id: check_changes
        run: |
          if git diff --quiet public/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Sem mudanças nos dados"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Alterações detectadas em public/data/"
            git diff --name-only public/data/
          fi

      - name: "Commit and push if changed"
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Determinar qual série foi atualizada
          SERIES_UPDATED=""
          if ! git diff --quiet public/data/selic.json; then
            SERIES_UPDATED="${SERIES_UPDATED}SELIC "
          fi
          if ! git diff --quiet public/data/ipca.json; then
            SERIES_UPDATED="${SERIES_UPDATED}IPCA "
          fi
          if ! git diff --quiet public/data/ptax.json; then
            SERIES_UPDATED="${SERIES_UPDATED}PTAX "
          fi

          git add public/data/*.json
          git commit -m "chore(data): atualiza séries do BCB — ${SERIES_UPDATED}[automated]"
          git push origin HEAD

      - name: "Notify on failure"
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_title = `❌ Falha no fetch de dados do BCB — ${new Date().toISOString().split('T')[0]}`;
            const issue_body = `
            **Workflow:** update-market-data
            **Status:** ❌ FALHOU
            **Data/Hora:** ${new Date().toISOString()}
            **Branch:** ${process.env.GITHUB_REF}
            **Commit:** ${process.env.GITHUB_SHA}
            **Run:** [${process.env.GITHUB_RUN_ID}](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})

            ### Impacto
            - Dados de mercado (SELIC, IPCA, PTAX) **não foram atualizados**
            - Calculadora continuará com última snapshot conhecida
            - Sem impacto imediato em produção, mas dados ficam obsoletos após ~24h

            ### Ação Necessária
            1. Investigar logs do workflow
            2. Validar endpoints BCB manualmente:
               - SELIC: https://api.bcb.gov.br/dados/serie/bcdata.sgs.11/dados?format=json
               - IPCA: https://api.bcb.gov.br/dados/serie/bcdata.sgs.433/dados?format=json
               - PTAX: https://api.bcb.gov.br/dados/serie/bcdata.sgs.10813/dados?format=json
            3. Se BCB estiver down, fechar esta issue depois de restaurar
            4. Se erro persistir, escalacionar para @marcus
            `;

            // Procura por issue existente não fechada
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ["automation:market-data", "severity:high"],
              state: "open"
            });

            if (issues.length === 0) {
              // Cria nova issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issue_title,
                body: issue_body,
                labels: ["automation:market-data", "severity:high", "needs-investigation"]
              });
            }


  # Job secundário: validar integridade dos dados
  validate-data:
    needs: update-market-data
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: "Validate JSON structure"
        run: |
          echo "🔍 Validando estrutura JSON..."

          # Validar selic.json
          if ! node -e "const data = require('./public/data/selic.json'); if (data.series !== '11' || !Array.isArray(data.data)) throw new Error('SELIC schema inválido')"; then
            echo "❌ selic.json estrutura inválida"
            exit 1
          fi
          echo "✅ selic.json validado"

          # Validar ipca.json
          if ! node -e "const data = require('./public/data/ipca.json'); if (data.series !== '433' || !Array.isArray(data.data)) throw new Error('IPCA schema inválido')"; then
            echo "❌ ipca.json estrutura inválida"
            exit 1
          fi
          echo "✅ ipca.json validado"

          # Validar ptax.json
          if ! node -e "const data = require('./public/data/ptax.json'); if (data.series !== '10813' || !Array.isArray(data.data)) throw new Error('PTAX schema inválido')"; then
            echo "❌ ptax.json estrutura inválida"
            exit 1
          fi
          echo "✅ ptax.json validado"

          # Validar feriados_nacionais.json
          if ! node -e "const data = require('./public/data/feriados_nacionais.json'); if (!Array.isArray(data.feriados)) throw new Error('feriados schema inválido')"; then
            echo "❌ feriados_nacionais.json estrutura inválida"
            exit 1
          fi
          echo "✅ feriados_nacionais.json validado"

          echo "✅ Todos os arquivos de dados validados com sucesso"

      - name: "Check data freshness"
        run: |
          echo "📅 Verificando atualização de dados..."

          SELIC_UPDATE=$(node -e "const data = require('./public/data/selic.json'); console.log(data.last_updated)")
          IPCA_UPDATE=$(node -e "const data = require('./public/data/ipca.json'); console.log(data.last_updated)")
          PTAX_UPDATE=$(node -e "const data = require('./public/data/ptax.json'); console.log(data.last_updated)")

          echo "📊 Última atualização:"
          echo "  SELIC: $SELIC_UPDATE"
          echo "  IPCA: $IPCA_UPDATE"
          echo "  PTAX: $PTAX_UPDATE"

